services:
  db:
    image: postgres:16-alpine
    container_name: collectai_db
    environment:
      # Values pulled from the root .env (docker compose auto-loads it for ${...}
      # substitution) — same PGUSER/PGPASSWORD/PGDATABASE as .env.example, just
      # remapped to the names the postgres image itself expects.
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-changeme}
      POSTGRES_DB: ${PGDATABASE:-collect_ai}
    ports:
      - "5433:5432" # host 5433 -> avoid clobbering a locally-running Postgres on 5432
    volumes:
      - collectai_pgdata:/var/lib/postgresql/data
      - ./app/machine-learning/config/schema_combined.sql:/docker-entrypoint-initdb.d/01-schema_combined.sql:ro
      - ./app/backend/db/schema_users.sql:/docker-entrypoint-initdb.d/02-schema_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collect_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    # container_name sengaja TIDAK dipakai: nama container harus unik, sedangkan
    # service ini di-scale jadi beberapa replika (lihat deploy.replicas).
    environment:
      # PGHOST/PGPORT sengaja TIDAK dibaca langsung dari .env: nilai di sana
      # ditujukan untuk menjalankan app/backend langsung di host (localhost /
      # DB remote), sedangkan di dalam network compose backend harus menembak
      # Postgres lewat nama service "db".
      # Kalau memang ingin stack ini memakai DB eksternal (bukan service "db"),
      # set COMPOSE_PGHOST/COMPOSE_PGPORT di .env — mis. COMPOSE_PGHOST=43.x.x.x
      PGHOST: ${COMPOSE_PGHOST:-db}
      PGPORT: ${COMPOSE_PGPORT:-5432}
      # Everything else comes straight from the root .env, same keys as .env.example.
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-changeme}
      PGDATABASE: ${PGDATABASE:-collect_ai}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-this-is-not-a-real-secret-32bytes}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      # Browser selalu bicara ke nginx (same-origin), jadi CORS praktis tidak
      # terpakai di alur normal — ini hanya jaring pengaman untuk akses langsung
      # ke :8000 (curl/Swagger) dan untuk frontend-dev profile di :5173.
      CORS_ALLOW_ORIGINS: '${CORS_ALLOW_ORIGINS:-["http://localhost","http://localhost:5173"]}'
      GOOGLE_AI_STUDIO_API_KEYS: ${GOOGLE_AI_STUDIO_API_KEYS:-[""]}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-25.0}
      AI_REASONING_ENABLED: ${AI_REASONING_ENABLED:-true}
      AI_REASONING_DAILY_CALL_LIMIT: ${AI_REASONING_DAILY_CALL_LIMIT:-300}
    # Rentang port sengaja lebih lebar dari jumlah replika default: tiap replika
    # mengambil satu port bebas dari rentang ini, jadi tetap bisa di-curl
    # langsung untuk debugging. Maksimum 10 replika dengan rentang ini.
    ports:
      - "8000-8009:8000"
    deploy:
      replicas: ${BACKEND_REPLICAS:-3}
    volumes:
      - ./app/backend:/app
      # The bind mount above replaces the whole /app tree with host content, which
      # would hide the image's baked-in ./shared/ copy — remount it explicitly so
      # `from shared.restructuring_offer_calculator import ...` keeps resolving.
      # Also mount app/machine-learning so backend sync background processes can
      # inspect registry.json, run ML pipelines, and load models.
      - ./app/shared:/app/shared
      - ./app/machine-learning:/app/machine-learning
    # Dipakai nginx lewat depends_on: nginx me-resolve DNS "be" sekali saat start,
    # jadi semua replika harus sudah siap sebelum container nginx dijalankan.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  # Frontend produksi: bundle Vite statis disajikan nginx, sekaligus jadi
  # reverse proxy + load balancer + rate limiter (ember bocor) ke service "be".
  # Konfigurasinya: app/frontend/nginx/nginx.conf.template
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_ENABLE_MSW: "false"
    container_name: collectai_frontend
    environment:
      # Diisi ke `server_name` di config nginx. Untuk produksi set di .env root,
      # mis. SERVER_NAME=collectai.example.com
      SERVER_NAME: ${SERVER_NAME:-localhost}
      # Batasi envsubst hanya ke SERVER_NAME supaya variabel nginx ($uri, $host,
      # dst) tidak ikut disubstitusi jadi string kosong. `$$` = literal `$`.
      NGINX_ENVSUBST_FILTER: "^SERVER_NAME$$"
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
    depends_on:
      be:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend mode DEV (hot reload Vite) — tidak ikut `docker compose up` biasa.
  # Jalankan dengan:  docker compose --profile dev up frontend-dev
  # Berguna saat ngoprek UI; proxy /api ditangani Vite (vite.config.ts), bukan
  # nginx, dan langsung menembak satu replika be tanpa load balancing.
  frontend-dev:
    profiles: ["dev"]
    image: node:24-alpine
    container_name: collectai_frontend_dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: /api
      VITE_ENABLE_MSW: "false"
      VITE_API_PROXY_TARGET: http://be:8000
    ports:
      - "5173:5173"
    volumes:
      - ./app/frontend:/app
      - collectai_frontend_node_modules:/app/node_modules
    depends_on:
      - be

volumes:
  collectai_pgdata:
  collectai_frontend_node_modules:
