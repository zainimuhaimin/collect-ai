services:
  db:
    image: postgres:16-alpine
    container_name: collectai_db
    environment:
      # Values pulled from the root .env (docker compose auto-loads it for ${...}
      # substitution) — same PGUSER/PGPASSWORD/PGDATABASE as .env.example, just
      # remapped to the names the postgres image itself expects.
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-changeme}
      POSTGRES_DB: ${PGDATABASE:-collect_ai}
    ports:
      - "5433:5432" # host 5433 -> avoid clobbering a locally-running Postgres on 5432
    volumes:
      - collectai_pgdata:/var/lib/postgresql/data
      - ./app/machine-learning/config/schema_combined.sql:/docker-entrypoint-initdb.d/01-schema_combined.sql:ro
      - ./app/backend/db/schema_users.sql:/docker-entrypoint-initdb.d/02-schema_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collect_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: collectai_be
    environment:
      # PGHOST/PGPORT are deliberately NOT read from .env: that file's PGHOST=localhost
      # is for running app/backend directly on the host — inside the compose network,
      # the backend must reach Postgres via the service name "db" instead.
      PGHOST: db
      PGPORT: "5432"
      # Everything else comes straight from the root .env, same keys as .env.example.
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-changeme}
      PGDATABASE: ${PGDATABASE:-collect_ai}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-this-is-not-a-real-secret-32bytes}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["http://localhost:5173"]}
    ports:
      - "8000:8000"
    volumes:
      - ./app/backend:/app
      # The bind mount above replaces the whole /app tree with host content, which
      # would hide the image's baked-in ./shared/ copy — remount it explicitly so
      # `from shared.restructuring_offer_calculator import ...` keeps resolving.
      - ./app/shared:/app/shared
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    container_name: collectai_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: /api
      VITE_ENABLE_MSW: "true"
      VITE_API_PROXY_TARGET: http://be:8000
    ports:
      - "5173:5173"
    volumes:
      - ./app/frontend:/app
      - collectai_frontend_node_modules:/app/node_modules
    depends_on:
      - be

volumes:
  collectai_pgdata:
  collectai_frontend_node_modules:
